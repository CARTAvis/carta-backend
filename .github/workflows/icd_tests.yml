            image: /opt/apptainer/almalinux9-mar2026.sif
            port: 9005
    needs: [Build, Prepare-ICD-RxJS]
    if: ${{ github.event.inputs.file_browser_animator_icd_tests == 'true' }}
    steps:
      # macOS steps
      - name: File Browser ICD tests
        if: matrix.os == 'macos'
